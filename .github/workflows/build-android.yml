name: Build Android APK

# Signed, sideloadable APK built entirely on the GitHub runner: `expo prebuild` + Gradle.
# No EAS at all (not cloud, not `eas build --local`), and never a local build on the PC —
# Phil's rule: every build happens here. Dispatch it:
#   gh workflow run build-android.yml --ref develop -f variant=dev
# Pushes to master build the release variant automatically (docs-only pushes do not).
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "release = com.philkolar.volumekeeper · dev = com.philkolar.volumekeeper.dev (simulation tools)"
        type: choice
        options: [release, dev]
        default: release
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: ${{ inputs.variant == 'dev' && 'dev' || '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "VK_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Expo prebuild (android/ from app.json + app.config.ts + plugins)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assemble release APK (arm64 only, the Pixel 10)
        working-directory: app/android
        env:
          VK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Check it is signed with the release key, not the debug one
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee certs.txt | head -3
          if grep -q "CN=Android Debug" certs.txt; then echo "APK is debug-signed"; exit 1; fi

      - name: Name the APK
        id: name
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="volumekeeper${APP_VARIANT:+-$APP_VARIANT}-v${VERSION}-${{ github.run_number }}"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: app/*.apk
          retention-days: 30
          if-no-files-found: error
